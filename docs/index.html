<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股趨勢雷達</title>
<meta name="description" content="台股兩週至一個月趨勢雷達：資料分析、機率預測、回測與虛擬交易。僅供研究與教育用途。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <h1>台股趨勢雷達</h1>
    <div class="sub">兩週至一個月趨勢機率估計 · 僅供研究與教育用途</div>
  </header>

  <div id="archive-bar" class="archivebar" style="display:none">
    <label for="archive-select">查看歷史存檔：</label>
    <select id="archive-select" aria-label="選擇歷史存檔日期"></select>
  </div>
  <div id="statusbar" class="statusbar"></div>
  <div id="alert-zone"></div>

  <div id="content">
    <div class="loading">載入中…</div>
  </div>

  <section id="ranking-section" style="display:none">
    <h2 class="section-title">預測排行榜</h2>
    <p class="small muted">點選欄位標題可排序；點選列可查看個股詳情。所有機率皆為模型估計值。</p>
    <div id="ranking-table"></div>
  </section>

  <section id="risk-section" style="display:none">
    <h2 class="section-title">風險排行榜（下行風險最小前 10 名）</h2>
    <p class="small muted">依未來 10 個交易日下行風險估計值由小到大排列。</p>
    <div id="risk-table"></div>
  </section>

  <section id="lab-section" style="display:none">
    <h2 class="section-title">實驗區・未驗證</h2>
    <p class="small muted">本區為未通過驗證之模型的原始輸出，僅予定性標示供研究對照；不可排序、不可篩選，不構成推薦或投資建議。</p>
    <div id="lab-table" class="lab-zone"></div>
  </section>

  <section id="forward-section" style="display:none">
    <h2 class="section-title">真實前瞻紀錄（prospective）</h2>
    <div id="forward-body"></div>
  </section>

  <section id="validation-section" style="display:none">
    <h2 class="section-title">模型驗證摘要</h2>
    <div id="validation-body"></div>
  </section>

  <footer class="footer" id="footer" style="display:none">
    <h3>資料來源</h3>
    <p id="f-sources"></p>
    <h3>資料日期</h3>
    <p id="f-dates"></p>
    <h3>樣本</h3>
    <p id="f-sample"></p>
    <h3>免責聲明</h3>
    <p id="f-disclaimer"></p>
  </footer>
</div>

<script src="assets/app.js"></script>
<script>
(function () {
  "use strict";

  function showError(msg) {
    var c = document.getElementById("content");
    c.innerHTML = "";
    var box = App.el("div", "error-box", msg);
    c.appendChild(box);
  }

  function renderStatus(meta, isArchive, archDate) {
    var bar = document.getElementById("statusbar");
    bar.innerHTML = "";
    if (isArchive) {
      bar.appendChild(App.el("span", "badge warn", "歷史存檔：" + App.fmtDate(archDate)));
    }
    bar.appendChild(App.el("span", "", "最後更新：" + App.fmtDateTime(meta.generated_at)));
    var day = App.el("span", "badge " + (meta.is_trading_day ? "ok" : "muted"),
      meta.is_trading_day ? "交易日" : "非交易日");
    bar.appendChild(day);
    if (meta.data_delayed) {
      bar.appendChild(App.el("span", "badge warn", "資料可能延遲（顯示前次正確結果）"));
    }
  }

  function renderAlert(meta, clsInfo, corrections) {
    var zone = document.getElementById("alert-zone");
    zone.innerHTML = "";
    // 存檔資料分類橫幅（只在存檔模式；clsInfo 由 ledger 證明決定）
    if (clsInfo) {
      if (clsInfo.cls === "reconstructed") {
        var n = App.el("div", "alert warn");
        n.appendChild(App.el("strong", "", "事後重建存檔"));
        n.appendChild(App.el("div", "",
          "事後重建，不代表當日實際發布。此存檔為事後以修正後模型重建，其預測數值不得作為歷史預測實績。"));
        var noteTxt = meta.note || meta.reconstructed_note;
        if (noteTxt) n.appendChild(App.el("div", "small muted", App.text(noteTxt)));
        zone.appendChild(n);
      } else if (clsInfo.cls === "unproven") {
        var u = App.el("div", "alert warn");
        u.appendChild(App.el("strong", "", "未經發布 ledger 證明"));
        u.appendChild(App.el("div", "",
          "此存檔未在不可覆寫的發布 ledger 中找到相符的凍結紀錄（或內容雜湊不符），不視為真實前瞻發布。"));
        zone.appendChild(u);
      } else if (clsInfo.cls === "prospective") {
        var pv = App.el("div", "alert info");
        pv.appendChild(App.el("strong", "", "正式發布紀錄"));
        pv.appendChild(App.el("div", "",
          "此日期的預測已於發布當下凍結於發布 ledger（內容雜湊驗證相符），屬真實前瞻發布紀錄。"));
        zone.appendChild(pv);
      }
    }
    // 勘誤（append-only correction ledger）：原值保留，另列更正與原因
    (corrections || []).forEach(function (c) {
      if (c.kind !== "correction") return;
      var cb = App.el("div", "alert warn");
      cb.appendChild(App.el("strong", "", "勘誤公告（原紀錄保留不覆寫）"));
      cb.appendChild(App.el("div", "", "原因：" + App.text(c.reason)));
      if (c.corrected) {
        cb.appendChild(App.el("div", "small",
          "更正內容：" + App.text(JSON.stringify(c.corrected))));
      }
      zone.appendChild(cb);
    });
    if (meta.model_valid === false) {
      var a = App.el("div", "alert danger");
      // 區分「驗證未通過」與「無足夠驗證資料」，避免誤導
      if (meta.validation_status === "insufficient") {
        a.appendChild(App.el("strong", "", "尚無足夠驗證資料"));
        a.appendChild(App.el("div", "",
          "樣本外驗證尚未執行或資料不足，無法評估模型預測能力，因此本站不顯示預測排行榜。以下僅提供市場資料與歷史統計，不構成投資建議。"));
      } else {
        a.appendChild(App.el("strong", "", "模型目前不具可靠預測能力"));
        a.appendChild(App.el("div", "",
          "樣本外驗證結果未優於基準模型，因此本站不顯示預測排行榜。以下僅提供市場資料與歷史統計，不構成投資建議。"));
      }
      zone.appendChild(a);
      return false;
    }
    return true;
  }

  function symCell(row) {
    var s = App.el("span", "sym", App.text(row.symbol));
    s.appendChild(App.el("small", "", App.text(row.name)));
    return s;
  }

  function renderRanking(preds, clsInfo) {
    var cols = [
      { key: "symbol", label: "代號 / 名稱", sortable: true, defaultDir: 1,
        render: symCell, getValue: function (r) { return r.symbol || ""; } },
      { key: "close", label: "收盤", sortable: true,
        render: function (r) { return App.el("span", "num", App.fmtPrice(r.close_raw != null ? r.close_raw : r.close)); },
        getValue: function (r) { return r.close_raw != null ? r.close_raw : r.close; } },
      { key: "p_up_10", label: "10日上漲機率", sortable: true,
        render: function (r) {
          var cell = App.probCell(r.p_up_10);
          // 實際結果對照徽章：僅限 ledger 證明的真實前瞻發布（prospective）；
          // 事後重建/模擬資料不得呈現為預測實績
          if (clsInfo && clsInfo.cls === "prospective" &&
              r.actual_up_10 !== null && r.actual_up_10 !== undefined) {
            var hit = (r.p_up_10 >= 0.5) === !!r.actual_up_10;
            var tag = App.el("span", "badge " + (hit ? "ok" : "warn"),
              (hit ? "✓ " : "✗ ") + (r.actual_up_10 ? "實際上漲" : "實際下跌"));
            tag.style.marginLeft = "6px";
            tag.style.fontSize = "0.72rem";
            cell.appendChild(tag);
          }
          return cell;
        },
        getValue: function (r) { return r.p_up_10; } },
      { key: "p_up_20", label: "20日上漲機率", sortable: true,
        render: function (r) { return App.probCell(r.p_up_20); },
        getValue: function (r) { return r.p_up_20; } },
      { key: "p_exc_10", label: "10日跑贏大盤機率", sortable: true,
        render: function (r) { return App.probCell(r.p_exc_10); },
        getValue: function (r) { return r.p_exc_10; } },
      { key: "downside_risk_10", label: "10日下行風險", sortable: true,
        render: function (r) {
          var s = App.el("span", "num", App.fmtPct(r.downside_risk_10));
          s.appendChild(App.estTag());
          return s;
        },
        getValue: function (r) { return r.downside_risk_10; } },
      { key: "trend", label: "趨勢", sortable: false,
        render: function (r) { return App.trendBadge(r.trend); } }
    ];
    var host = document.getElementById("ranking-table");
    host.innerHTML = "";
    host.appendChild(App.buildSortableTable(cols, preds, { key: "p_up_10", dir: -1 }));
    document.getElementById("ranking-section").style.display = "";
  }

  function renderRisk(preds) {
    var top = preds.slice().sort(function (a, b) {
      var va = App.isValidNumber(a.downside_risk_10) ? a.downside_risk_10 : Infinity;
      var vb = App.isValidNumber(b.downside_risk_10) ? b.downside_risk_10 : Infinity;
      return va - vb;
    }).slice(0, 10);
    var cols = [
      { key: "rank", label: "#", sortable: false,
        render: function (r) { return App.el("span", "num muted", String(r.__rank)); } },
      { key: "symbol", label: "代號 / 名稱", sortable: false, render: symCell },
      { key: "downside_risk_10", label: "10日下行風險", sortable: false,
        render: function (r) {
          var s = App.el("span", "num", App.fmtPct(r.downside_risk_10));
          s.appendChild(App.estTag());
          return s;
        } },
      { key: "trend", label: "趨勢", sortable: false,
        render: function (r) { return App.trendBadge(r.trend); } }
    ];
    top.forEach(function (r, i) { r.__rank = i + 1; });
    var host = document.getElementById("risk-table");
    host.innerHTML = "";
    host.appendChild(App.buildSortableTable(cols, top, { key: "rank", dir: 1 }));
    document.getElementById("risk-section").style.display = "";
  }

  function renderValidation(meta, validation) {
    var body = document.getElementById("validation-body");
    body.innerHTML = "";
    var card = App.el("div", "card");
    card.appendChild(App.el("h3", "", "樣本外驗證（walk-forward）"));
    var targets = (validation && validation.targets) || {};
    ["up_10", "up_20"].forEach(function (t) {
      var m = (targets[t] && targets[t].metrics) || {};
      var label = t === "up_10" ? "10 日上漲" : "20 日上漲";
      card.appendChild(App.el("h3", "mt", label));
      card.appendChild(App.kvRow("樣本數",
        App.isValidNumber(m.n) ? Number(m.n).toLocaleString("zh-TW") : App.NO_DATA));
      card.appendChild(App.kvRow("AUC（模型 / 全猜上漲基準 / 動量基準）",
        App.isValidNumber(m.auc)
          ? m.auc.toFixed(3) + " / " +
            (App.isValidNumber(m.auc_always) ? m.auc_always.toFixed(3) : App.NO_DATA) + " / " +
            (App.isValidNumber(m.auc_mom) ? m.auc_mom.toFixed(3) : App.NO_DATA)
          : App.NO_DATA));
      card.appendChild(App.kvRow("Brier score（模型 / 全猜上漲基準 / 動量基準）",
        App.isValidNumber(m.brier)
          ? m.brier.toFixed(4) + " / " +
            (App.isValidNumber(m.brier_always) ? m.brier_always.toFixed(4) : App.NO_DATA) + " / " +
            (App.isValidNumber(m.brier_mom) ? m.brier_mom.toFixed(4) : App.NO_DATA)
          : App.NO_DATA));
    });
    card.appendChild(App.el("p", "small muted",
      "無論模型是否通過驗證，此處皆顯示真實樣本外數據；詳細各期指標請見 validation.json。"));
    body.appendChild(card);
    document.getElementById("validation-section").style.display = "";
  }

  function renderFooter(meta) {
    var f = document.getElementById("footer");
    var src = (meta.sources || []).join("、") || App.NO_DATA;
    document.getElementById("f-sources").textContent = src;
    var dd = meta.data_dates || {};
    var parts = [];
    [["price", "股價"], ["institutional", "三大法人"], ["margin", "融資融券"], ["revenue", "月營收"], ["financials", "財報"]].forEach(function (p) {
      parts.push(p[1] + "：" + App.fmtDate(dd[p[0]]));
    });
    document.getElementById("f-dates").textContent = parts.join("；");
    var u = meta.universe || {};
    var cred = meta.credibility || {};
    var sampleEl = document.getElementById("f-sample");
    sampleEl.textContent =
      "納入 " + App.text(u.included) + " 檔、排除 " + App.text(u.excluded) + " 檔；" +
      "樣本外驗證樣本數 " + (App.isValidNumber(cred.oos_n) ? Number(cred.oos_n).toLocaleString("zh-TW") : App.NO_DATA) + "。";
    // 排除名單（含原因）：有排除時必須列出，不可只顯示數字
    var excl = meta.excluded || [];
    if (excl.length) {
      var ul = App.el("ul", "excluded-list");
      excl.forEach(function (e) {
        var li = App.el("li", "");
        li.appendChild(App.el("span", "sym", App.text(e.symbol) + " " + App.text(e.name || "")));
        li.appendChild(App.el("span", "muted small", " — " + App.text(e["排除原因"] || e.reason || "")));
        ul.appendChild(li);
      });
      sampleEl.appendChild(ul);
    }
    document.getElementById("f-disclaimer").textContent = App.text(meta.risk_disclaimer);
    f.style.display = "";
  }

  // 非同步競速防護：只有最後一次選擇的日期可以更新畫面
  var loadRequestId = 0;

  // 模型未通過驗證時的預設畫面：不提供個股方向、不顯示精確百分比/排名/機率條。
  // 定性標示只進「實驗區・未驗證」，且該表不可排序、不可篩選。
  function renderInvalidView(preds, meta) {
    var sec = document.getElementById("ranking-section");
    sec.style.display = "";
    sec.querySelector(".section-title").textContent = "個股方向";
    var note = sec.querySelector(".small.muted");
    if (note) note.textContent = "";
    var host = document.getElementById("ranking-table");
    host.innerHTML = "";
    var warn = App.el("div", "alert danger");
    warn.appendChild(App.el("strong", "", "模型未通過驗證，暫不提供個股方向"));
    warn.appendChild(App.el("div", "",
      "樣本外驗證顯示模型不具可靠預測能力，本站預設不提供任何個股的漲跌方向、機率或排名。市場價格資料請見下方實驗區對照欄位，驗證數據請見模型驗證摘要。"));
    host.appendChild(warn);

    // 實驗區：僅定性標示（趨勢）＋市場資料（收盤價），靜態表、無排序/篩選控制
    var labSec = document.getElementById("lab-section");
    labSec.style.display = "";
    var labHost = document.getElementById("lab-table");
    labHost.innerHTML = "";
    var cols = [
      { key: "symbol", label: "代號 / 名稱", sortable: false, render: symCell },
      { key: "close", label: "收盤（官方原始）", sortable: false,
        render: function (r) { return App.el("span", "num", App.fmtPrice(r.close_raw != null ? r.close_raw : r.close)); } },
      { key: "trend", label: "定性標示（實驗・未驗證）", sortable: false,
        render: function (r) { return App.trendBadge(r.trend); } }
    ];
    var rows = preds.slice().sort(function (a, b) {
      return String(a.symbol).localeCompare(String(b.symbol));
    });
    labHost.appendChild(App.buildSortableTable(cols, rows, { key: "symbol", dir: 1 }));
  }

  // 真實前瞻紀錄狀態：只認 ledger 累積（meta.prospective_progress 由發布流程寫入）
  function renderForward(meta, ledger) {
    var sec = document.getElementById("forward-section");
    var body = document.getElementById("forward-body");
    body.innerHTML = "";
    var card = App.el("div", "card");
    var pp = meta.prospective_progress || null;
    var days = pp ? pp.published_days : (ledger ? ledger.index.length : 0);
    var minDays = (pp && pp.min_published_days) || 120;
    card.appendChild(App.el("p", "",
      "真實前瞻發布紀錄（發布當下凍結於不可覆寫 ledger 者）已累積 " + days + " / " + minDays + " 個交易日。"));
    card.appendChild(App.el("p", "small muted",
      "狀態：資料累積中。未達門檻前，即使歷史驗證改善，模型也不會標示為可信；" +
      "回溯模擬（walk-forward）與事後重建資料永遠不計入此前瞻紀錄。"));
    body.appendChild(card);
    sec.style.display = "";
  }

  // 主流程：載入指定日期的資料（null = 最新）
  function loadDay(archDate) {
    var myId = ++loadRequestId;
    window.__archiveDate = archDate || null;
    var isArchive = !!archDate;
    var metaPath = isArchive ? "data/archive/meta_" + archDate + ".json" : "data/meta.json";
    var predPath = isArchive ? "data/archive/predictions_" + archDate + ".json" : "data/predictions.json";
    // 切換時先清除舊內容，避免殘留與警告重複
    document.getElementById("content").innerHTML = "";
    document.getElementById("alert-zone").innerHTML = "";
    document.getElementById("ranking-section").style.display = "none";
    document.getElementById("risk-section").style.display = "none";
    document.getElementById("lab-section").style.display = "none";
    document.getElementById("forward-section").style.display = "none";
    document.getElementById("validation-section").style.display = "none";
    var rankingHost = document.getElementById("ranking-table");
    rankingHost.innerHTML = "";
    rankingHost.classList.remove("research-gray");
    // 恢復排行榜標題（未驗證畫面會改掉它）
    var rankTitle = document.querySelector("#ranking-section .section-title");
    if (rankTitle) rankTitle.textContent = "預測排行榜";
    var rankNote = document.querySelector("#ranking-section .small.muted");
    if (rankNote) rankNote.textContent = "點選欄位標題可排序；點選列可查看個股詳情。所有機率皆為模型估計值。";

    App.fetchJSON(metaPath).then(function (res) {
      if (myId !== loadRequestId) return; // 已被更新的選擇取代
      if (!res.ok) {
        showError("資料尚未產生（" + metaPath + " 讀取失敗）。請等待自動更新完成後再試。");
        return;
      }
      var meta = res.data || {};
      renderStatus(meta, isArchive, archDate);

      // 驗證數據一律從 validation.json 讀取（無論模型通過與否）
      var valPath = isArchive ? null : "data/validation.json";
      var valPromise = valPath ? App.fetchJSON(valPath) : Promise.resolve({ ok: false });

      App.fetchJSON(predPath).then(function (pr) {
        if (myId !== loadRequestId) return;
        return Promise.all([valPromise, App.fetchLedger()]).then(function (rs) {
          if (myId !== loadRequestId) return;
          var vr = rs[0], ledger = rs[1];
          var validation = (vr.ok && vr.data) || null;
          // 存檔分類只認明確欄位 + ledger 證明（不以日期/檔名猜測）
          var clsInfo = isArchive ? App.resolveArchiveClass(meta, archDate, ledger) : null;
          var corrections = isArchive ? App.correctionsFor(ledger, archDate) : [];
          var valid = renderAlert(meta, clsInfo, corrections);
          renderFooter(meta);
          renderValidation(meta, validation);
          renderForward(meta, ledger);
          if (!pr.ok || !Array.isArray(pr.data)) {
            if (valid) showError("預測資料讀取失敗（" + predPath + "）。");
            return;
          }
          if (valid) {
            renderRanking(pr.data, clsInfo);
            renderRisk(pr.data);
          } else {
            renderInvalidView(pr.data, meta);
          }
        });
      });
    });
  }

  // 歷史存檔選單（選項標示資料分類：正式發布須 ledger 命中，其餘舊存檔為事後重建）
  function initArchive() {
    Promise.all([App.fetchJSON("data/archive/index.json"), App.fetchLedger()]).then(function (rs) {
      var res = rs[0], ledger = rs[1];
      if (!res.ok || !Array.isArray(res.data) || !res.data.length) return;
      var bar = document.getElementById("archive-bar");
      var sel = document.getElementById("archive-select");
      sel.innerHTML = "";
      var opt0 = document.createElement("option");
      opt0.value = "";
      opt0.textContent = "最新資料";
      sel.appendChild(opt0);
      res.data.forEach(function (e) {
        if (!e.date) return;
        var o = document.createElement("option");
        o.value = e.date;
        var clsTag;
        if (App.ledgerEntryFor(ledger, e.date)) clsTag = "正式發布";
        else if (e.data_class === "prospective") clsTag = "未經 ledger 證明";
        else clsTag = "事後重建";
        o.textContent = e.date + "（" + clsTag + "）" +
          (e.generated_at ? " " + App.fmtDateTime(e.generated_at) + " 更新" : "");
        sel.appendChild(o);
      });
      sel.addEventListener("change", function () {
        loadDay(sel.value || null);
      });
      bar.style.display = "";
    });
  }

  // 支援 ?date=YYYY-MM-DD 直接開啟歷史存檔（由個股頁返回時用）
  var initDate = App.getQueryParam("date");
  function startWithArchive() {
    App.fetchJSON("data/archive/index.json").then(function (res) {
      var valid = res.ok && Array.isArray(res.data) &&
        res.data.some(function (e) { return e.date === initDate; });
      if (valid) {
        loadDay(initDate);
        // 選單載入後同步選取值
        var sel = document.getElementById("archive-select");
        if (sel) {
          var iv = setInterval(function () {
            if (sel.options.length > 1) {
              sel.value = initDate;
              clearInterval(iv);
            }
          }, 200);
          setTimeout(function () { clearInterval(iv); }, 5000);
        }
      } else {
        loadDay(null);
      }
      initArchive();
    }).catch(function () {
      loadDay(null);
      initArchive();
    });
  }

  if (initDate) startWithArchive();
  else { loadDay(null); initArchive(); }
})();
</script>
</body>
</html>
